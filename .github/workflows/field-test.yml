name: SiteBoss field test builds
on:
  push:
    branches: [feature/claude-api]
    paths: ['mobile/**', '.github/workflows/field-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBoss-Android-field-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBoss-Android-unsigned-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: command -v xcodegen || brew install xcodegen
      - working-directory: mobile/ios
        run: |
          xcodegen generate
          xcodebuild -scheme SiteBossTest -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/SiteBossTest.app SiteBoss-Simulator.zip
          xcodebuild -scheme SiteBossTest -configuration Release -destination 'generic/platform=iOS' -archivePath build/SiteBossTest.xcarchive CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent build/SiteBossTest.xcarchive SiteBoss-UnsignedArchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBoss-iOS-test-builds
          path: mobile/ios/SiteBoss-*.zip
